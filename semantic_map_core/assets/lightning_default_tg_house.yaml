# 针对NCLT的配置
common:
  dataset: "nclt"
  lidar_topic: "points_raw"
  livox_lidar_topic: "/livox/lidar"
  imu_topic: "/tg/imu"

# fasterlio 参数
fasterlio:
  lidar_type: 1                # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR,
  scan_line: 6                 # Livox AVIA 是 6 线雷达
  blind: 0.5                # 盲区，小于盲区距离的不会处理
  time_scale: 1e-3             # 兼容不同数据集的时间单位，仅对Velodyne LiDAR(lidar_type=2)生效

  skip_lidar_num: 0 # 点云的跳帧情况
  point_filter_num: 2 # 点云采样参数
  max_iteration: 6 # 最大迭代次数
  filter_size_scan: 0.5 # 对scan进行的降采样
  filter_size_map: 0.5

  ivox_grid_resolution: 0.5        # default=0.2
  ivox_nearby_type: 18             # 6, 18, 26
  esti_plane_threshold: 0.1        # default=0.1

  use_aa: true  # use anderson-acceleration

  acc_cov: 0.1
  gyr_cov: 0.1
  b_acc_cov: 0.0001
  b_gyr_cov: 0.0001
  extrinsic_est_en: false      # true: enable the online estimation of IMU-LiDAR extrinsic
  extrinsic_T: [0, 0, 0]
  extrinsic_R: [ 0, 1, 0,
                 -1, 0, 0,
                 0, 0, 1 ]
  keep_first_imu_estimation: false
  gravity_align_en: true      # run one gravity alignment after IMU init (needed by probability_map ground estimation)


g2p5:
  esti_floor: true   # 是否动态估计地面
  lidar_height: 0.0   # 雷达安装高度
  floor_height: -1.2   # 默认地面高度
  min_th_floor: 0.10  # 距离地面这个高度的障碍物被扫入栅格地图中
  max_th_floor: 0.5  # 距离地面这个高度的障碍物被扫入栅格地图中
  grid_map_resolution: 0.1 # 栅格地图分辨率

system:
  with_loop_closing: false # 是否需要回环检测

  # ---------------- visualization (display only; independent of map building) ----------------
  with_3dui: false     # 3D Pangolin window (point cloud / trajectory / keyframes)
  with_2dui: false     # 2D window(s); shows whichever 2D map(s) below are enabled
  step_on_kf: false   # 2D UI only: pause (single-step) at each keyframe

  # ---------------- 2D map building (each builds a map; displayed in 2D UI when with_2dui) ----------------
  with_g2p5: false           # g2p5 occupancy grid (off by default)
  with_probabilitymap: false  # probability occupancy grid (default 2D map)

  enable_lidar_loc_skip: false
  enable_lidar_loc_rviz: false
  enable_lidar_odom_skip: false
  evaluation: false
  lidar_loc_skip_num: 4
  lidar_odom_skip_num: 2
  map_path: ./data/new_map/
  pub_tf: true

# ---- REP-105 pose publishing for navigation (online modes only) ----
# TF tree: map --(slow, may jump)--> odom --(high-freq, continuous)--> base(IMU) --(static)--> lidar
# Single writer rule: run either the slam node OR the loc node, never both (both own odom->base).
pub_topics:
  pub_tf: true               # odom->base (+ map->odom when valid) TF
  pub_odom: true             # nav_msgs/Odometry (odom frame, twist in base frame)
  odom_topic: "lightning/odometry"
  pub_pose_map: true         # fused map-frame pose (jumps with corrections - by design)
  pose_map_topic: "lightning/pose_map"
  pub_static_lidar_tf: true  # base->lidar extrinsic; set false if a URDF already provides it
  odom_pub_hz: 100.0         # high-freq rate cap (sensor time); <=0 = every IMU sample
  frame_map: "map"
  frame_odom: "odom"
  frame_base: "base"         # rename to base_link here if your nav stack expects that
  frame_lidar: "lidar"

loop_closing:
  loop_kf_gap: 20       # 每隔多少个关键帧检查一次
  min_id_interval: 20   # 被检查的关键帧ID间隔
  closest_id_th: 50     # 历史关键帧与当前帧的ID间隔
  max_range: 30.0       # 候选帧的最大距离
  ndt_score_th: 1.3     # ndt位姿分值
  with_height: true


### localization ================================================================================================
lidar_loc:
  enable_dynamic_polygon: false
  enable_parking_static: true
  enable_icp_adjust: false
  filter_intensity_max: 100.0
  filter_intensity_min: 10.0
  filter_z_max: 30.0
  filter_z_min: -1.0
  force_2d: false
  grid_search_angle_range: 180.0
  grid_search_angle_step: 60
  lidar_loc_odom_th: 0.5
  init_with_fp: true
  min_init_confidence: 1.8
  update_dynamic_cloud: true
  update_err_h: 0.2
  update_err_v: 0.2
  update_kf_dis: 2.0
  update_lidar_loc_score: 2.5
  loc_on_kf: true
  try_self_extrap: false
maps:
  delete_when_unload: false
  dyn_cloud_policy: persistent
  load_dyn_cloud: true
  load_map_size: 2
  max_pts_dyn_chunk: 100000
  save_dyn_when_quit: true
  save_dyn_when_unload: false
  unload_map_size: 4
  with_dyn_area: false
pgo:
  dr_ang_noise: 0.5
  dr_pos_noise: 1.0
  dr_pos_noise_ratio: 1.0
  lidar_loc_ang_noise: 1.0
  lidar_loc_outlier_th: 5.0
  lidar_loc_pos_noise: 0.3
  lidar_odom_ang_noise: 1.0
  lidar_odom_pos_noise: 0.3
  pgo_frame_converge_ang_th: 1.0
  pgo_frame_converge_pos_th: 0.05
  rtk_fix_ang_noise: 2.0
  rtk_fix_pos_noise: 1.0
  rtk_height_noise_ratio: 10.0
  rtk_other_ang_noise: 10.0
  rtk_other_pos_noise: 5.0
  rtk_outlier_th: 1.0
  smooth_factor: 0.01
roi:
  height_max: 0.5
  height_min: -2.0
  range_max: 70
  range_min: 3.0
ui:
  car_length: 2.0
  car_width: 1.6
  car_height: 1.7
  scans: 1

# 2D probability (occupancy) grid. Curated tunables below; advanced/rarely-changed
# knobs (back_hit/miss_probability, enable_low_obstacle_tolerance, angle_min/max_deg,
# local_ground_update_max_height, min_return_distance_gap) are omitted and fall back
# to the defaults in probability_grid/map_builder.h Config -- add them only if needed.
probability_map:
  # --- grid geometry ---
  map_resolution: 0.1     # cell size in metres (smaller = finer map, more memory/CPU)
  initial_width: 100      # initial grid width in cells; the map auto-grows as needed
  initial_height: 100     # initial grid height in cells; the map auto-grows as needed

  # --- publish throttle ---
  publish_period_s: 1.0   # min seconds between snapshot/CV-conversion/UI updates;
                          # grid insertion itself stays per-frame. <=0 = every frame

  # --- occupancy sensor model ---
  # hit/miss probabilities (front-end per-frame 0.55/0.49, back-end per-keyframe
  # 0.80/0.35) are left at their defaults in map_builder.h Config; add
  # hit_probability/miss_probability/back_hit_probability/back_miss_probability
  # here only if you need to retune them.
  insert_free_space: true # carve free space along each ray (false = only mark hits)

  # --- ground estimation (decides which points are obstacles vs floor) ---
  ground_method: ransac   # ransac: single global plane + local anchors (legacy behaviour)
                          # patchworkplus: Patchwork++ per-point segmentation (better on
                          # slopes/uneven ground); tune via optional top-level patchworkplus: block
  esti_floor: true        # true: fit the ground plane per frame; false: use floor_height
  floor_height: -1.2      # lidar mount height above ground for THIS dataset (~1.2 m);
                          # seeds the floor-candidate slab + fallback when fitting fails.
                          # MUST match the sensor-to-floor height or walls get mis-classified
                          # as ground and carved away by free rays (keep in sync with g2p5).
  lidar_height: 0.0       # lidar mount height above ground (m); 0 if unknown
  min_th_floor: 0.10      # a point is an obstacle if its height above ground is in
  max_th_floor: 0.9       #   [min_th_floor, max_th_floor] metres (below = floor/free)

  # --- sloped / uneven ground (per-ray local ground tracking; see floor-fit notes) ---
  enable_local_ground_filter: true  # track ground height along each ray (ramps / pitch)
  local_ground_max_slope: 0.50      # max accepted local ground slope (m/m, ~26.6 deg);
                                    # 0.10 was too tight -> rising ground read as a false-obstacle ring
  local_ground_height_margin: 0.03  # tolerance band around the tracked local ground (m)

  # --- 3D->2D projection ---
  usable_scan_range: 10.0       # ignore returns beyond this range (m)
  multi_return_per_angle: true  # keep several obstacle hits per angle bin (thin obstacles)
  max_returns_per_angle: 3      # cap on obstacle hits kept per angle bin

# ---- logging: output mode only; levels/dir are fixed in code ----
logging:
  mode: 3   # 1 = terminal only, 2 = file only, 3 = file + terminal (default)
